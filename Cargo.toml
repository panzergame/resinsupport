[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.95"
authors = ["ResinSupport contributors"]

[workspace.dependencies]
# internal
resin-geom = { path = "crates/geom" }
resin-render = { path = "crates/render" }
resin-slice = { path = "crates/slice" }
resin-io = { path = "crates/io" }
resin-engine = { path = "crates/engine" }
resin-ui-egui = { path = "crates/ui-egui" }

# foundation
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
log = "0.4"
sha2 = "0.10"
zip = { version = "9", default-features = false, features = ["deflate"] }

# ui
egui = "0.36"
eframe = { version = "0.36", default-features = false, features = ["persistence"] }
egui-wgpu = "0.36"
wgpu = { version = "30", default-features = false, features = ["std", "wgsl"] }
bytemuck = { version = "1", features = ["derive"] }
sys-locale = "0.3"
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
rfd = "0.17"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"
# `!(x > tol)` is our idiom for "not a usable number" (NaN-safe).
neg_cmp_op_on_partial_ord = "allow"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
debug = "line-tables-only"
